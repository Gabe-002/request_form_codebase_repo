<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Holder</title>
        <link rel="stylesheet" href="/static/css/base.css">
        <link rel="stylesheet" href="/static/css/request_portal.css">
        <script src="/static/js/request_portal.js" defer></script>
    </head>

    <body>
        <header>
            <div class="header-content">
                <div class="left-header-side">
                    <img src="/static/images/getsitelogo.jpeg" alt="TEICHMANN PROJECTS" class="responsive-img">
                    <h1>Welcome {{user[0].get("user_first_name")}} {{user[0].get("user_surname")}}</h1>
                </div>
                <button id="logout-button" type="button">Logout</button>
            </div>
        </header>

        <div class="panels">
            <a href="/requests/new" class="request-portal-item" id="new-box" style="grid-area: box-1">
                New Request Form
            </a>
            <a href="/requests/pending/page" class="request-portal-item" id="pending-box" style="grid-area: box-2">
                Pending Forms
            </a>
            <a href="/requests/completed/page" class="request-portal-item" id="completed-box" style="grid-area: box-3">
                Completed Forms
            </a>
            <div id="search-box" style="grid-area: box-4">
                <div class="label">Search for a Request</div>
                <input id="requests-search-bar" type="text" placeholder="Search for a request...">
                <div id="search-results">
                    
                </div>
            </div>
        </div>

        <div class="filler-content">

        <div class="filler-content">
            <div class="img-container">
                <div class="info-block">
                    Test
                </div>
                <img src="/static/images/option_one.jpg" alt="TEICHMANN PROJECTS" class="filler-img">
            </div>
        </div>

        <script id="page-data" type="application/json">
            {
                "userId": {{user[0].id}},
                "userRole": "{{user[0].role}}"
            }
        </script>
    </body>
</html>
