{% macro input(name, description, type="text", placeholder="") %}
<div class="input-fields">
    <label for="{{name}}">{{description}}</label>
    <input name="{{name}}" id="{{name}}" type="{{type}}" placeholder="{{placeholder}}">
</div>
{% endmacro %}

<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Holder</title>
        <link rel="stylesheet" href="/static/css/login.css">
        <script src="/static/js/login.js" defer></script>
    </head>

    <body>
        <div class="login-block">
            <h1>Request Application</h1>
            <div class="format-input">
                {{ input("username", "Username", placeholder="jerrySien") }}
                {{ input("password", "Password", type="password", placeholder="t3.projects.123") }}
            </div>
            <div id="incorrect-credentials" style="display:none">
                
            </div>
            <button type="button" id="login-button">Login</button>
        </div>
    </body>
</html>
